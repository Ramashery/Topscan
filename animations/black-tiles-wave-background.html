<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Волна из чёрных плиток — анимированный фон</title>

<style>
  :root { --bg: #000; --text: #ececec; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; background: var(--bg); color: var(--text); }
  body { font-family: "Helvetica Neue", "Segoe UI", system-ui, -apple-system, Arial, sans-serif; }

  /* ───── ФОН ───── */
  #bg {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; z-index: 0; pointer-events: none;
  }
  /* мягкое затемнение по краям — текст читается лучше */
  .bg-vignette {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 25%, rgba(0,0,0,.72) 100%),
      linear-gradient(to bottom, rgba(0,0,0,.35), rgba(0,0,0,0) 30%, rgba(0,0,0,0) 70%, rgba(0,0,0,.45));
  }
  /* запасной вариант, если WebGL недоступен */
  html.no-webgl body {
    background:
      repeating-linear-gradient(28deg, #0b0b0b 0 22px, #151515 22px 44px),
      #050505;
  }

</style>
</head>

<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="bg-vignette" aria-hidden="true"></div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  /* ═════════ НАСТРОЙКИ ═════════ */
  var CFG = {
    speed:        0.8,   // скорость волны (0.3 — медленно, 1.5 — быстро)
    amplitude:    1.15,  // высота волн, в размерах плитки
    waveLength:   18,    // расстояние между гребнями, в плитках
    ridgeAngle:   14,    // наклон гребней на экране, ° (как в исходнике: вниз вправо)
    gridAngle:   -28,    // поворот сетки плиток, °
    cameraTilt:   58,    // угол обзора над плоскостью, ° (90 = строго сверху)
    tileGap:      0.09,  // зазор между плитками
    tileHeight:   0.7,   // толщина плитки
    cellMinPx:    26,    // минимальный размер плитки на экране, px
    cellMaxPx:    58,    // максимальный размер плитки на экране, px
    maxTiles:     9000,  // лимит плиток на десктопе
    maxTilesMobile: 3800,// лимит плиток на телефонах
    exposure:     1.15,  // общая яркость (поднимите, если кажется темно)
    pixelRatioMax: 2
  };

  var canvas = document.getElementById('bg');
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || Math.min(screen.width, screen.height) < 600;

  if (typeof THREE === 'undefined') { document.documentElement.classList.add('no-webgl'); return; }

  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: !isMobile, alpha: false, powerPreference: 'high-performance' });
  } catch (e) { document.documentElement.classList.add('no-webgl'); return; }

  renderer.setClearColor(0x000000, 1);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = CFG.exposure;

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(32, 1, 0.1, 600);
  var group = new THREE.Group();
  group.rotation.y = THREE.MathUtils.degToRad(CFG.gridAngle);
  scene.add(group);

  /* ═════════ ОТРАЖЕНИЯ (глянец) ═════════
     Небольшая «студия» из светящихся полос: наклоняясь, плитки
     ловят блики — так возникают светлые полосы, бегущие по волне. */
  (function makeEnvironment() {
    var env = new THREE.Scene();
    env.add(new THREE.Mesh(
      new THREE.BoxGeometry(24, 24, 24),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(0.012, 0.012, 0.012), side: THREE.BackSide })
    ));
    function panel(w, h, dir, power) {
      var m = new THREE.Mesh(
        new THREE.PlaneGeometry(w, h),
        new THREE.MeshBasicMaterial({ color: new THREE.Color(power, power, power), side: THREE.DoubleSide })
      );
      m.position.copy(new THREE.Vector3(dir[0], dir[1], dir[2]).normalize().multiplyScalar(9));
      m.lookAt(0, 0, 0);
      env.add(m);
    }
    panel(11, 2.2, [ 0.20, 0.80, -0.50], 6.0);  // главная полоса — бегущие блики
    panel(7,   7,  [-0.70, 0.40, -0.30], 0.9);  // мягкая подсветка — серые плитки
    panel(3,   9,  [ 0.90, 0.50, -0.20], 2.6);  // боковая полоса
    panel(9,   1.2,[ 0.60, 0.15,  0.70], 1.6);  // низкий контровой свет — блики на фасках
    var pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(env, 0.035).texture;
    pmrem.dispose();
  })();

  var key = new THREE.DirectionalLight(0xffffff, 0.9);
  key.position.set(-6, 10, 5);
  scene.add(key);
  var rim = new THREE.DirectionalLight(0xdfe6ff, 0.35);
  rim.position.set(8, 3, -6);
  scene.add(rim);

  var material = new THREE.MeshStandardMaterial({
    color: 0x2a2a2a, metalness: 0.6, roughness: 0.3, envMapIntensity: 1.0
  });

  /* ═════════ ПЛИТКА СО СКРУГЛЁННЫМИ КРАЯМИ ═════════ */
  function roundedSlab(w, h, d, r) {
    var g = new THREE.BoxBufferGeometry(w, h, d, 3, 3, 3);
    var pos = g.attributes.position, nor = g.attributes.normal;
    var half = [w / 2, h / 2, d / 2];
    var inner = [half[0] - r, half[1] - r, half[2] - r];
    var p = [0, 0, 0], c = [0, 0, 0], dv = [0, 0, 0];
    for (var i = 0; i < pos.count; i++) {
      p[0] = pos.getX(i); p[1] = pos.getY(i); p[2] = pos.getZ(i);
      for (var a = 0; a < 3; a++) {
        var k = Math.round((p[a] / half[a] + 1) * 1.5);          // 0..3
        p[a] = [-half[a], -inner[a], inner[a], half[a]][k];
        c[a] = Math.max(-inner[a], Math.min(inner[a], p[a]));
        dv[a] = p[a] - c[a];
      }
      var len = Math.sqrt(dv[0] * dv[0] + dv[1] * dv[1] + dv[2] * dv[2]);
      if (len > 1e-6) {
        for (var b = 0; b < 3; b++) dv[b] /= len;
        pos.setXYZ(i, c[0] + dv[0] * r, c[1] + dv[1] * r, c[2] + dv[2] * r);
        nor.setXYZ(i, dv[0], dv[1], dv[2]);
      } else {
        pos.setXYZ(i, p[0], p[1], p[2]);
      }
    }
    pos.needsUpdate = true; nor.needsUpdate = true;
    return g;
  }

  var tileSize = 1 - CFG.tileGap;
  var geometry = roundedSlab(tileSize, CFG.tileHeight, tileSize, 0.07);

  /* ═════════ СЕТКА ═════════ */
  var mesh = null, count = 0, gridN = 0, xs, zs;
  var dummy = new THREE.Object3D();

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function buildGrid(n) {
    if (mesh) { group.remove(mesh); mesh.dispose(); }
    gridN = n; count = n * n;
    xs = new Float32Array(count); zs = new Float32Array(count);
    mesh = new THREE.InstancedMesh(geometry, material, count);
    mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    mesh.frustumCulled = false;

    var rnd = mulberry32(7), col = new THREE.Color(), i = 0;
    for (var row = 0; row < n; row++) {
      for (var cl = 0; cl < n; cl++, i++) {
        xs[i] = cl - (n - 1) / 2;
        zs[i] = row - (n - 1) / 2;
        var r = rnd(), s = 0.25 + 0.75 * r * r;         // в основном тёмные плитки
        if (rnd() < 0.07) s = 1.2 + rnd() * 0.6;        // редкие более светлые
        col.setScalar(s);
        mesh.setColorAt(i, col);
      }
    }
    mesh.instanceColor.needsUpdate = true;
    group.add(mesh);
  }

  /* ═════════ РАЗМЕР / КАМЕРА ═════════ */
  var W = 0, H = 0, camDist = 30;

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, CFG.pixelRatioMax, isMobile ? 1.75 : 2);
    renderer.setPixelRatio(dpr);
    renderer.setSize(W, H, false);
    camera.aspect = W / H;

    var cellPx = Math.max(CFG.cellMinPx, Math.min(CFG.cellMaxPx, Math.min(W, H) / 14));
    var visH = H / cellPx;                                   // высота кадра в плитках
    var tilt = THREE.MathUtils.degToRad(CFG.cameraTilt);
    camDist = (visH / 2) / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    camera.position.set(0, Math.sin(tilt) * camDist, Math.cos(tilt) * camDist);
    camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix();

    scene.fog = new THREE.Fog(0x000000, camDist * 1.0, camDist * 2.4);

    var visW = visH * camera.aspect;
    var groundH = visH / Math.sin(tilt);
    var R = 0.5 * Math.sqrt(Math.pow(visW * 1.5, 2) + Math.pow(groundH * 1.5, 2));
    var n = Math.ceil(2 * R) + 2;
    var cap = Math.floor(Math.sqrt(isMobile ? CFG.maxTilesMobile : CFG.maxTiles));
    n = Math.min(n, cap);
    if (n !== gridN) buildGrid(n);
  }

  /* ═════════ ВОЛНА ═════════
     Гребни идут под углом ridgeAngle, волна бежит поперёк них.
     Форма гребня — синус с гармоникой (получаются «ступени»,
     как на исходной картинке), линия гребня слегка «дышит»,
     поверх — мелкая рябь. Каждая плитка наклоняется вдоль
     поверхности, поэтому по ней бегут блики. */
  var TWO_PI = Math.PI * 2;

  function update(t) {
    var sp = CFG.speed, A = CFG.amplitude, k = TWO_PI / CFG.waveLength;
    var gTheta = THREE.MathUtils.degToRad(CFG.gridAngle);
    var rho = THREE.MathUtils.degToRad(CFG.ridgeAngle);
    // направление гребня в мировых координатах → в координатах сетки
    var wdx = Math.cos(rho), wdz = Math.sin(rho);
    var ldx = wdx * Math.cos(gTheta) - wdz * Math.sin(gTheta);
    var ldz = wdx * Math.sin(gTheta) + wdz * Math.cos(gTheta);
    var ux = -ldz, uz = ldx;               // поперёк гребней (направление бега волны)

    var w = 0.9 * sp, m = 0.6, q = 0.09, w2 = 0.15 * sp;
    var B = 0.22, tilt = 0.7, lim = 0.6;

    for (var i = 0; i < count; i++) {
      var x = xs[i], z = zs[i];
      var u = x * ux + z * uz;
      var v = x * ldx + z * ldz;

      var mv = q * v + t * w2;
      var th = k * u - t * w + m * Math.sin(mv);
      var dthdu = 1, cm = m * q * Math.cos(mv);
      var dthx = k * ux + cm * ldx;
      var dthz = k * uz + cm * ldz;

      var g  = Math.sin(th) + 0.28 * Math.sin(2 * th + 1.3);
      var gd = Math.cos(th) + 0.56 * Math.cos(2 * th + 1.3);

      var r1 = x * 0.21 + t * 0.30 * sp, r2 = z * 0.17 - t * 0.25 * sp;
      var h  = A * g + B * Math.sin(r1) * Math.cos(r2);
      var hx = A * gd * dthx + B * 0.21 * Math.cos(r1) * Math.cos(r2);
      var hz = A * gd * dthz - B * 0.17 * Math.sin(r1) * Math.sin(r2);

      hx = Math.max(-lim, Math.min(lim, hx)) * tilt;
      hz = Math.max(-lim, Math.min(lim, hz)) * tilt;

      dummy.position.set(x, h, z);
      dummy.rotation.set(-hz, 0, hx);
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
    }
    mesh.instanceMatrix.needsUpdate = true;
  }

  /* ═════════ ЦИКЛ ═════════ */
  var raf = 0, t0 = performance.now(), running = false;

  function frame(now) {
    raf = requestAnimationFrame(frame);
    var t = (now - t0) / 1000;
    // очень медленный дрейф камеры
    camera.position.x = Math.sin(t * 0.06) * camDist * 0.02;
    camera.lookAt(0, 0, 0);
    update(t + 20);
    renderer.render(scene, camera);
  }
  function start() { if (!running && !reduceMotion) { running = true; raf = requestAnimationFrame(frame); } }
  function stop()  { running = false; cancelAnimationFrame(raf); }
  function drawStatic() { update(23); renderer.render(scene, camera); }

  var resizeTimer = 0;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { resize(); if (reduceMotion || !running) drawStatic(); }, 120);
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stop(); else start();
  });
  canvas.addEventListener('webglcontextlost', function (e) { e.preventDefault(); stop(); });
  canvas.addEventListener('webglcontextrestored', function () { resize(); start(); });

  resize();
  if (reduceMotion) drawStatic(); else start();
})();
</script>
</body>
</html>
