<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Фон: чернильный дым</title>
<style>
  html { background: #000; height: 100%; }
  body { margin: 0; min-height: 100%; background: transparent; }
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; display: block; pointer-events: none; }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<script>
(() => {
  const CONFIG = {
    speed: 1.0,        // скорость течения (0.5 — вдвое медленнее)
    intensity: 0.62,   // общая яркость узора (0.3 — тише, 1.0 — ярче)
    cell: 3,           // размер ячейки сетки в CSS-пикселях (2 — мельче, 5 — крупнее)
    gap: 0.28,         // ширина тёмных промежутков сетки (0 — без сетки)
    maxPixels: 2.4e6
  };

  const canvas = document.getElementById('bg');
  const gl = canvas.getContext('webgl', { antialias: false, alpha: false, powerPreference: 'low-power' });
  if (!gl) return;

  const vert = `attribute vec2 a; void main(){ gl_Position = vec4(a,0.,1.); }`;

  const frag = `
    precision highp float;
    uniform vec2  u_res;
    uniform float u_time, u_cell, u_gap, u_int;

    float hash12(vec2 p){
      vec3 p3 = fract(vec3(p.xyx) * .1031);
      p3 += dot(p3, p3.yzx + 33.33);
      return fract((p3.x + p3.y) * p3.z);
    }
    vec2 hash22(vec2 p){
      vec3 p3 = fract(vec3(p.xyx) * vec3(.1031, .1030, .0973));
      p3 += dot(p3, p3.yzx + 33.33);
      return fract((p3.xx + p3.yz) * p3.zy);
    }
    float gnoise(vec2 p){
      vec2 i = floor(p), f = fract(p);
      vec2 u = f*f*f*(f*(f*6.-15.)+10.);
      float a = dot(hash22(i)             *2.-1., f);
      float b = dot(hash22(i+vec2(1.,0.)) *2.-1., f-vec2(1.,0.));
      float c = dot(hash22(i+vec2(0.,1.)) *2.-1., f-vec2(0.,1.));
      float d = dot(hash22(i+vec2(1.,1.)) *2.-1., f-vec2(1.,1.));
      return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
    }
    float fbm(vec2 p){
      float v = 0., a = .5;
      mat2 m = mat2(.8,.6,-.6,.8) * 2.03;
      for(int i = 0; i < 5; i++){ v += a * gnoise(p); p = m * p; a *= .5; }
      return v;
    }

    void main(){
      vec2 frag = gl_FragCoord.xy;

      // 1) поле считаем в центре ячейки сетки — получается «пиксельная» зернистость,
      //    а сама сетка привязана к экрану и не движется, поэтому мерцания нет
      vec2 cid = floor(frag / u_cell);
      vec2 cc  = (cid + .5) * u_cell;
      vec2 p   = (cc - .5*u_res) / min(u_res.x, u_res.y) * 1.5;
      float t  = u_time * .035;

      // 2) чернильное течение: двойное искажение координат
      vec2 q = vec2(fbm(p + vec2(0., t)),
                    fbm(p + vec2(5.2, 1.3) - vec2(t*.8, 0.)));
      vec2 r = vec2(fbm(p + 3.*q + vec2(1.7, 9.2) + t*1.2),
                    fbm(p + 3.*q + vec2(8.3, 2.8) + t));
      float v = fbm(p + 3.5*r) * 1.25 + .5;

      // 3) заливка с мягкой кромкой и тонкие светлые контуры на границах
      float mass = smoothstep(.40, .60, v);
      float edge = exp(-abs(v - .44) * 36.) * .85
                 + exp(-abs(v - .60) * 28.) * .25;
      float lum  = mass * .26 + edge * .62;
      lum *= .55 + .9 * length(q);              // неравномерная плотность

      // 4) сетка: тёмные линии между ячейками, как на референсе
      vec2 f = fract(frag / u_cell);
      vec2 g = smoothstep(vec2(0.), vec2(u_gap) + .001, f);
      float grid = mix(1., g.x * g.y, step(.001, u_gap));
      lum *= grid;

      // 5) виньетка и ЧЁРНО-БЕЛЫЙ вывод
      vec2 uv = frag / u_res;
      lum *= mix(.6, 1., smoothstep(1.4, .2, length(uv - .5) * 1.4));
      lum *= u_int;

      // статичный дизеринг (не зависит от времени — не мерцает)
      lum += (hash12(frag) - .5) / 255.;
      gl_FragColor = vec4(vec3(clamp(lum, 0., 1.)), 1.);
    }
  `;

  const sh = (type, src) => {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); return null; }
    return s;
  };
  const vs = sh(gl.VERTEX_SHADER, vert), fs = sh(gl.FRAGMENT_SHADER, frag);
  if (!vs || !fs) return;
  const prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(prog)); return; }
  gl.useProgram(prog);

  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'a');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const U = n => gl.getUniformLocation(prog, n);
  const uRes = U('u_res'), uTime = U('u_time');
  gl.uniform1f(U('u_gap'), CONFIG.gap);
  gl.uniform1f(U('u_int'), CONFIG.intensity);

  function resize() {
    let dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = innerWidth, h = innerHeight;
    dpr *= Math.min(1, Math.sqrt(CONFIG.maxPixels / (w*h*dpr*dpr)));
    canvas.width = Math.max(1, Math.round(w*dpr));
    canvas.height = Math.max(1, Math.round(h*dpr));
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform1f(U('u_cell'), Math.max(2, Math.round(CONFIG.cell * dpr)));   // целое число пикселей — без муара
  }
  addEventListener('resize', resize); resize();

  const reduce = matchMedia('(prefers-reduced-motion: reduce)');
  let last = performance.now(), sim = 0;
  (function frame(now) {
    const dt = Math.min((now - last)/1000, .05); last = now;
    sim += dt * CONFIG.speed * (reduce.matches ? .35 : 1);
    gl.uniform1f(uTime, sim + 50.);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  })(last);
})();
</script>
</body>
</html>
