<!-- ============ LEAD FORM ============ -->
<section class="lead-section" id="lead" style="border-bottom:none;">
<div class="wrap">
<div class="lead-layout">
<div class="lead-copy reveal">
<div class="eyebrow">{{ lead.eyebrow }}</div>
<h2>{{ lead.title }}</h2>
<p>{{ lead.desc }}</p>
<ul class="lead-list">
{% for point in lead.points %}
<li>{{ point }}</li>
{% endfor %}
</ul>
</div>
<form class="reveal" id="leadForm">
<input name="access_key" type="hidden" value="{{ SITE.formAccessKey }}"/>
<input name="subject" type="hidden" value="New request from TOPSCAN website — {{ lead_subject or 'General' }}"/>
<input name="from_name" type="hidden" value="TOPSCAN — Website"/>
<input autocomplete="off" name="botcheck" style="display:none" tabindex="-1" type="text"/>
<div class="field-row">
<div class="field"><label for="name">{{ lead.fieldName }}</label><input id="name" name="Name" placeholder="{{ lead.fieldNamePh }}" required="" type="text"/></div>
<div class="field"><label for="phone">{{ lead.fieldPhone }}</label><input id="phone" name="Phone" placeholder="+995 5__ ___ ___" required="" type="tel"/></div>
</div>
<div class="field"><label for="email">{{ lead.fieldEmail }}</label><input id="email" name="Email" placeholder="you@example.com" required="" type="email"/></div>
<div class="field"><label for="site">{{ lead.fieldProject }}</label><input id="site" name="Object_and_task" placeholder="{{ lead.fieldProjectPh }}" type="text"/></div>
<div class="field"><label for="comment">{{ lead.fieldComment }}</label><textarea id="comment" name="Comment" placeholder="{{ lead.fieldCommentPh }}" rows="3"></textarea></div>
<button class="btn submit-btn" type="submit">{{ lead.submit }}</button>
<p class="form-status" id="leadFormStatus"></p>
<p class="form-note"><span>{{ lead.consentPre }}</span><a href="{{ SITE_PREFIX }}/{{ lang }}/privacy">{{ lead.consentLink }}</a></p>
</form>
</div>
</div>
</section>
