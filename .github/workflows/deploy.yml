name: Build & Deploy TOPSCAN site

on:
  push:
    branches: [main]
  workflow_dispatch: {}      # allows manual "Run workflow" button in the Actions tab
  schedule:
    - cron: "0 3 * * *"      # optional: daily rebuild at 03:00 UTC so content edits
                              # made in Firestore (without a git push) go live too.
                              # Remove this block if you don't want automatic rebuilds.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate static site from Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          BASE_URL: https://topscan.tech
          SITE_PREFIX: ""
          INDEXNOW_ENABLED: "1"          # prepare the list of new/changed URLs for Bing (IndexNow)
        run: python3 generate_site.py

      - name: Add CNAME (custom domain)
        run: echo "topscan.tech" > public/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Save IndexNow URL list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-pending
          path: indexnow-pending.json
          if-no-files-found: ignore

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # ── IndexNow: runs only after the new version is live ──────────
      - name: Checkout (for indexnow_submit.py)
        uses: actions/checkout@v4

      - name: Download IndexNow URL list
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: indexnow-pending

      - name: Submit changed URLs to Bing (IndexNow)
        continue-on-error: true
        run: python3 indexnow_submit.py
