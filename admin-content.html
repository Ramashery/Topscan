<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TOPSCAN Admin — Content</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link rel="stylesheet" href="/admin.css">
</head>
<body data-mode="content">
<div class="sov" id="sov"></div>
<div class="shell" style="display:flex">
  <aside class="sidebar" id="sidebar">
    <div class="sbl"><div class="lmark">TS</div><div class="ltxt">TOPSCAN<small>Admin Panel</small></div></div>
    <nav class="snav" id="snav"></nav>
  </aside>
  <div class="main">
    <div class="topbar">
      <button class="tbt" id="dtt"><span class="material-symbols-outlined">menu</span></button>
      <button class="tbt" id="mbt" style="display:none"><span class="material-symbols-outlined">menu</span></button>
      <span class="tt" id="tptitle"></span><span class="tc" id="tpcrumb"></span>
    </div>
    <div class="ct" id="panels"></div>
  </div>
</div>
<div class="mo" id="mmod"><div class="md">
  <div class="mh"><h2 id="mtitle"></h2><button class="mc2b" id="mclose"><span class="material-symbols-outlined" style="font-size:26px">close</span></button></div>
  <div class="mb" style="padding:20px">
    <div class="fi full" id="idrow" style="margin-bottom:16px"><label class="fl">Document ID <span class="tip">(slug, used in the URL)</span></label><input class="fin" id="newid" placeholder="my-new-item"></div>
    <div id="mform"></div>
  </div>
  <div class="mf"><button class="btn bd2 bxs" id="mdel"><span class="material-symbols-outlined ic">delete</span>Delete</button>
    <div style="display:flex;gap:10px"><button class="btn bg2b" id="mcancel">Cancel</button><button class="btn bp" id="msave"><span class="material-symbols-outlined ic">save</span>Save</button></div></div>
</div></div>
<script>if(innerWidth<768){document.getElementById('dtt').style.display='none';document.getElementById('mbt').style.display=''}</script>
<script type="module" src="/admin.js"></script>
</body>
</html>
